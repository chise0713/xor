name: Benchmark xor implementation

on:
  push:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/bench.yml"
    branches:
      - "**"
  pull_request:

jobs:
  bench:
    name: Bench
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
      - name: Install Rust nightly toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly
      - name: Detect native cpu
        id: cpu
        run: |
          echo "hash=$(rustc -Ctarget-cpu=native --print cfg | tee /dev/stderr \
            | sha256sum | cut -d' ' -f1)" >> $GITHUB_OUTPUT
      - name: Cache cargo registry, index, and targets
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: "cargo-bench-${{ steps.cpu.outputs.hash }}-${{ steps.toolchain.outputs.cachekey }}"
          add-job-id-key: false
      - name: Run benchmarks
        run: |
          echo -e "### Benchmark results\n" '```console' >> $GITHUB_STEP_SUMMARY
          RUSTFLAGS="-Ctarget-cpu=native" cargo +nightly \
            bench --locked --features bench --verbose \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> $GITHUB_STEP_SUMMARY
        shell: bash
